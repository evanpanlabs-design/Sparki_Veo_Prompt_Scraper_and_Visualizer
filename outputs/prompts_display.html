<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Library — Sparki Veo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0a0f;
      color: #e0e0e0;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: #111118;
      border-bottom: 1px solid #222;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.3px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    /* ── Status bar ── */
    #status-bar {
      background: #111118;
      border-bottom: 1px solid #1a1a24;
      padding: 10px 24px;
      display: flex;
      gap: 24px;
      font-size: 13px;
      color: #888;
    }

    #status-bar .stat {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #status-bar .stat .val {
      color: #fff;
      font-weight: 600;
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #444;
    }
    .dot.ok { background: #22c55e; }
    .dot.fail { background: #ef4444; }

    /* ── Controls ── */
    #controls {
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #1a1a24;
    }

    #btn-start {
      background: #6366f1;
      color: #fff;
      border: none;
      padding: 8px 20px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    #btn-start:hover { background: #4f46e5; }
    #btn-start:disabled { background: #333; color: #666; cursor: not-allowed; }

    #job-status {
      font-size: 13px;
      color: #888;
    }

    /* ── Category filter ── */
    #filters {
      padding: 12px 24px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .filter-btn {
      background: #1a1a28;
      color: #888;
      border: 1px solid #2a2a3a;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn.active {
      background: #6366f1;
      color: #fff;
      border-color: #6366f1;
    }

    /* ── Prompt grid ── */
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      padding: 16px 24px;
    }

    .card {
      background: #111118;
      border: 1px solid #1e1e2e;
      border-radius: 12px;
      overflow: hidden;
      transition: border-color 0.2s, transform 0.2s;
    }

    .card:hover {
      border-color: #3a3a5a;
      transform: translateY(-2px);
    }

    .card-img {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      background: #1a1a28;
      display: block;
    }

    .card-img.placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #444;
      font-size: 13px;
    }

    .card-body {
      padding: 14px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 6px;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-badge {
      display: inline-block;
      background: #1e1e3a;
      color: #a5b4fc;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
    }

    .card-prompt {
      font-size: 12px;
      color: #666;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: #555;
    }

    .card-meta a {
      color: #6366f1;
      text-decoration: none;
    }

    .card-meta a:hover { text-decoration: underline; }

    /* ── Empty / loading states ── */
    .empty-state {
      text-align: center;
      padding: 80px 24px;
      color: #555;
      font-size: 15px;
    }

    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #2a2a3a;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Refresh indicator ── */
    #refresh-msg {
      font-size: 12px;
      color: #444;
      padding: 6px 24px;
      text-align: center;
    }
  </style>
</head>
<body>

<header>
  <h1>Sparki Prompt Library</h1>
  <div class="header-right">
    <button id="btn-start">Start Pipeline</button>
  </div>
</header>

<div id="status-bar">
  <div class="stat">
    <div class="dot" id="dot-login"></div>
    <span>X Login:</span>
    <span class="val" id="val-login">—</span>
  </div>
  <div class="stat">
    <span>Tweets:</span>
    <span class="val" id="val-tweets">—</span>
  </div>
  <div class="stat">
    <span>Prompts:</span>
    <span class="val" id="val-prompts">—</span>
  </div>
  <div class="stat">
    <span>Images:</span>
    <span class="val" id="val-images">—</span>
  </div>
</div>

<div id="controls">
  <span id="job-status">Ready</span>
</div>

<div id="filters"></div>

<div id="refresh-msg"></div>
<div id="grid">
  <div class="empty-state">
    <div class="spinner"></div>
    Loading...
  </div>
</div>

<script>
const API = "http://127.0.0.1:5000";
let prompts = [];
let activeFilter = "all";
let currentJobId = null;

// ── Init ─────────────────────────────────────────────────────────────────────

async function refresh() {
  await Promise.all([loadStatus(), loadPrompts()]);
}

async function loadStatus() {
  try {
    const r = await fetch(`${API}/status`);
    const s = await r.json();

    document.getElementById("dot-login").className = "dot " + (s.logged_in ? "ok" : "fail");
    document.getElementById("val-login").textContent = s.logged_in ? "OK" : "Not logged in";
    document.getElementById("val-tweets").textContent = s.tweets;
    document.getElementById("val-prompts").textContent = s.prompts;
    document.getElementById("val-images").textContent = s.images;
  } catch (e) {
    document.getElementById("val-login").textContent = "Server unreachable";
  }
}

async function loadPrompts() {
  try {
    const r = await fetch(`${API}/prompts`);
    const data = await r.json();
    prompts = data.prompts || [];
    buildFilters();
    renderGrid();
  } catch (e) {
    document.getElementById("grid").innerHTML =
      `<div class="empty-state">Server unreachable — start web_server.py first.</div>`;
  }
}

// ── Filters ──────────────────────────────────────────────────────────────────

function buildFilters() {
  const cats = [...new Set(prompts.map(p => p.category))].sort();
  const container = document.getElementById("filters");
  container.innerHTML = `
    <button class="filter-btn ${activeFilter === "all" ? "active" : ""}" data-cat="all">All</button>
    ${cats.map(c => `
      <button class="filter-btn ${activeFilter === c ? "active" : ""}" data-cat="${c}">
        ${c}
      </button>
    `).join("")}
  `;
  container.querySelectorAll(".filter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      activeFilter = btn.dataset.cat;
      buildFilters();
      renderGrid();
    });
  });
}

// ── Render ────────────────────────────────────────────────────────────────────

function renderGrid() {
  const filtered = activeFilter === "all"
    ? prompts
    : prompts.filter(p => p.category === activeFilter);

  const container = document.getElementById("grid");

  if (filtered.length === 0) {
    container.innerHTML = `<div class="empty-state">No prompts yet — run Phase 1+2 first.</div>`;
    return;
  }

  container.innerHTML = filtered.map(p => `
    <div class="card">
      ${p.image_gcs_url
        ? `<img class="card-img" src="${p.image_gcs_url}" alt="${p.title}" loading="lazy" onerror="this.outerHTML='<div class=card-img placeholder>No image</div>'">`
        : `<div class="card-img placeholder">Generating...</div>`
      }
      <div class="card-body">
        <div class="card-badge">${p.category}</div>
        <div class="card-title">${escHtml(p.title)}</div>
        <div class="card-prompt">${escHtml(p.prompt_text)}</div>
        <div class="card-meta">
          <a href="${p.url}" target="_blank">@${escHtml(p.author_screen)}</a>
          <span>${p.likes_count || 0} likes</span>
        </div>
      </div>
    </div>
  `).join("");
}

function escHtml(s) {
  if (!s) return "";
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

// ── Job polling ────────────────────────────────────────────────────────────────

async function pollJob(jid) {
  const MAX_POLLS = 120;
  let polls = 0;
  const el = document.getElementById("job-status");

  async function tick() {
    if (polls >= MAX_POLLS) return;
    polls++;
    try {
      const r = await fetch(`${API}/job/${jid}`);
      const job = await r.json();

      if (job.status === "running") {
        el.textContent = `Job running... (phase: ${job.phase})`;
        setTimeout(tick, 2000);
      } else if (job.status === "done") {
        el.textContent = `Job done! phase=${job.phase}`;
        currentJobId = null;
        document.getElementById("btn-start").disabled = false;
        setTimeout(refresh, 500);
      } else if (job.status === "error") {
        el.textContent = `Job error: ${job.error}`;
        currentJobId = null;
        document.getElementById("btn-start").disabled = false;
      }
    } catch (e) {
      el.textContent = `Poll error: ${e}`;
    }
  }
  tick();
}

// ── Controls ──────────────────────────────────────────────────────────────────

document.getElementById("btn-start").addEventListener("click", async () => {
  const btn = document.getElementById("btn-start");
  if (currentJobId) return;
  btn.disabled = true;
  btn.textContent = "Starting...";

  try {
    const r = await fetch(`${API}/start`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ phase: "all" }),
    });
    const data = await r.json();
    currentJobId = data.job_id;
    document.getElementById("job-status").textContent = `Job started: ${currentJobId}`;
    pollJob(currentJobId);
  } catch (e) {
    btn.disabled = false;
    btn.textContent = "Start Pipeline";
    alert("Failed to start: " + e);
  }
});

// ── Auto-refresh every 30s ───────────────────────────────────────────────────

refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
